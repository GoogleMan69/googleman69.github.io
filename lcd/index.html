<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RGB Scroll Brightness</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }
    #container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    .color-column {
      flex: 1;
      height: 100vh;
      transition: background-color 0.1s;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="red" class="color-column"></div>
    <div id="green" class="color-column"></div>
    <div id="blue" class="color-column"></div>
  </div>

  <script>
    const columns = {
      red: { element: document.getElementById("red"), brightness: 128 },
      green: { element: document.getElementById("green"), brightness: 128 },
      blue: { element: document.getElementById("blue"), brightness: 128 }
    };

    for (const key in columns) {
      const col = columns[key];
      updateColor(col.element, key, col.brightness);

      let lastY = null;
      col.element.addEventListener("touchstart", (e) => {
        lastY = e.touches[0].clientY;
      });

      col.element.addEventListener("touchmove", (e) => {
        if (lastY !== null) {
          const deltaY = e.touches[0].clientY - lastY;
          col.brightness -= deltaY * 0.5;
          col.brightness = Math.max(0, Math.min(255, col.brightness));
          updateColor(col.element, key, col.brightness);
          lastY = e.touches[0].clientY;
        }
        e.preventDefault();
      });
    }

    function updateColor(elem, color, brightness) {
      const r = color === 'red' ? brightness : 0;
      const g = color === 'green' ? brightness : 0;
      const b = color === 'blue' ? brightness : 0;
      elem.style.backgroundColor = `rgb(${r},${g},${b})`;
    }
  </script>
</body>
</html>
